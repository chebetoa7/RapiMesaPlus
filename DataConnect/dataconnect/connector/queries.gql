# Queries for Restaurant App

query ListRestaurants @auth(level: USER) {
  restaurants {
    id
    name
    tableCount
    adminId
    admin { id name }
  }
}

query GetUserById($id: String!) @auth(level: USER) {
  user(id: $id) {
    id name email role restaurantId subscriptionPlanId adminId
  }
}

query GetOrdersByWaiter($waiterId: String!) @auth(level: USER) {
  orders(where: { waiterId: { eq: $waiterId } }) {
    id status totalAmount createdAt table { identifier }
  }
}

query GetUsersByRestaurant($restaurantId: String!) @auth(level: USER) {
  users(where: { restaurantId: { eq: $restaurantId } }) {
    id name role email
  }
}

query ListAllUsers @auth(level: USER) {
  users {
    id
    name
    email
    role
    phone
    restaurantId
  }
}

query GetMenuByRestaurant($restaurantId: UUID!) @auth(level: USER) {
  menuCategories(where: { restaurantId: { eq: $restaurantId } }, orderBy: { sortOrder: ASC }) {
    id
    name
    iconUrl
    menuItems_on_category {
      id
      name
      description
      price
      imageUrl
      isAvailable
    }
  }
}

# Tables
query ListTablesByRestaurant($restaurantId: UUID!) @auth(level: USER) {
  tables(where: { restaurantId: { eq: $restaurantId } }) {
    id
    identifier
    status
  }
}

query GetTableById($id: UUID!) @auth(level: USER) {
  table(id: $id) {
    id
    restaurantId
    identifier
    status
  }
}

# Orders
query ListOrdersByRestaurant($restaurantId: UUID!) @auth(level: USER) {
  orders(where: { restaurantId: { eq: $restaurantId } }, orderBy: { createdAt: DESC }) {
    id
    tableId
    waiterId
    orderType
    customerName
    customerPhone
    status
    totalAmount
    createdAt
    confirmedAt
    cookingStartedAt
    readyAt
    orderItems_on_order {
      id
      productId
      name
      quantity
      price
      extras
      kitchenNotes
    }
  }
}

query GetOrderById($id: UUID!) @auth(level: USER) {
  order(id: $id) {
    id
    tableId
    waiterId
    orderType
    customerName
    customerPhone
    status
    totalAmount
    comments
    createdAt
    confirmedAt
    cookingStartedAt
    readyAt
    orderItems_on_order {
      id
      productId
      name
      quantity
      price
      extras
      kitchenNotes
    }
  }
}

# Menu Categories and Items
query GetMenuCategoryById($id: UUID!) @auth(level: USER) {
  menuCategory(id: $id) {
    id
    name
    iconUrl
    sortOrder
    restaurantId
  }
}

query GetMenuItemById($id: UUID!) @auth(level: USER) {
  menuItem(id: $id) {
    id
    name
    description
    price
    imageUrl
    isAvailable
    categoryId
  }
}

# Subscriptions
query ListSubscriptionPlans @auth(level: USER) {
  subscriptionPlans {
    id
    name
    pricePerMonth
    maxRestaurants
    maxAdmins
    maxWaiters
  }
}

query GetSubscriptionPlanByName($name: String!) @auth(level: USER) {
  subscriptionPlans(where: { name: { eq: $name } }, limit: 1) {
    id
    name
    pricePerMonth
    maxRestaurants
    maxAdmins
    maxWaiters
  }
}

query GetSubscriptionPlanById($id: UUID!) @auth(level: USER) {
  subscriptionPlan(id: $id) {
    id
    name
    pricePerMonth
    maxRestaurants
    maxAdmins
    maxWaiters
  }
}

# Limits Check Queries
query GetRestaurantsByAdmin($adminId: String!) @auth(level: USER) {
  restaurants(where: { adminId: { eq: $adminId } }) {
    id
  }
}

query GetWaitersByAdmin($adminId: String!) @auth(level: USER) {
  users(where: { adminId: { eq: $adminId }, role: { eq: "waiter" } }) {
    id
  }
}

query GetAdminsByAdmin($adminId: String!) @auth(level: USER) {
  users(where: { adminId: { eq: $adminId }, role: { eq: "restaurant_admin" } }) {
    id
  }
}

# ===========================================================================
# PUSH NOTIFICATIONS
# ===========================================================================

# Busca un dispositivo por su token FCM (clave natural del dispositivo).
query GetPushDeviceByToken($token: String!) @auth(level: USER) {
  pushDevices(where: { token: { eq: $token } }, limit: 1) {
    id
    token
    userId
    restaurantId
    role
    platform
    deviceLabel
    isActive
    lastSeenAt
    createdAt
  }
}

# Todos los dispositivos conocidos (para hidratar la caché en memoria al
# arrancar la API). Se usa solo desde el backend.
query ListAllPushDevices @auth(level: USER) {
  pushDevices {
    id
    token
    userId
    restaurantId
    role
    platform
    deviceLabel
    isActive
    lastSeenAt
    createdAt
  }
}

# Dispositivos de un restaurante (para el panel de administración).
query ListPushDevicesByRestaurant($restaurantId: String!) @auth(level: USER) {
  pushDevices(where: { restaurantId: { eq: $restaurantId } }, orderBy: { lastSeenAt: DESC }) {
    id
    token
    userId
    restaurantId
    role
    platform
    deviceLabel
    isActive
    lastSeenAt
    createdAt
  }
}

# Historial de pushes enviados (el más reciente primero).
query ListPushMessagesByRestaurant($restaurantId: String!, $limit: Int) @auth(level: USER) {
  pushMessages(where: { restaurantId: { eq: $restaurantId } }, orderBy: { createdAt: DESC }, limit: $limit) {
    id
    eventType
    deliveryMode
    restaurantId
    senderUserId
    senderRole
    audience
    targetUserId
    topic
    title
    body
    payload
    status
    targetCount
    successCount
    failureCount
    providerMessageId
    createdAt
  }
}
