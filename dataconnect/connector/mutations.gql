# Mutations for Restaurant App

mutation CreateUser($id: String!, $name: String!, $email: String!, $role: String!, $phone: String, $restaurantId: String, $subscriptionPlanId: UUID, $adminId: String) @auth(level: USER) {
  user_insert(data: {
    id: $id,
    name: $name,
    email: $email,
    role: $role,
    phone: $phone,
    restaurantId: $restaurantId
    subscriptionPlanId: $subscriptionPlanId
    adminId: $adminId
  })
}

mutation CreateRestaurant($name: String!, $tableCount: Int!, $adminId: String!) @auth(level: USER) {
  restaurant_insert(data: {
    name: $name,
    tableCount: $tableCount,
    adminId: $adminId
  })
}

mutation CreateOrder($restaurantId: UUID!, $waiterId: String!, $tableId: UUID!, $totalAmount: Float!, $comments: String) @auth(level: USER) {
  order_insert(data: {
    restaurantId: $restaurantId,
    waiterId: $waiterId,
    tableId: $tableId,
    totalAmount: $totalAmount,
    status: "open",
    comments: $comments
  })
}

mutation UpdateOrderStatus($id: UUID!, $status: String!) @auth(level: USER) {
  order_update(id: $id, data: { status: $status })
}

mutation UpdateUser($id: String!, $name: String, $phone: String, $role: String, $restaurantId: String, $subscriptionPlanId: UUID, $adminId: String) @auth(level: USER) {
  user_update(id: $id, data: {
    name: $name,
    phone: $phone,
    role: $role,
    restaurantId: $restaurantId
    subscriptionPlanId: $subscriptionPlanId
    adminId: $adminId
  })
}

mutation DeleteUser($id: String!) @auth(level: USER) {
  user_delete(id: $id)
}

mutation CreateMenuCategory($restaurantId: UUID!, $name: String!, $iconUrl: String, $sortOrder: Int!) @auth(level: USER) {
  menuCategory_insert(data: {
    restaurantId: $restaurantId,
    name: $name,
    iconUrl: $iconUrl,
    sortOrder: $sortOrder
  })
}

mutation CreateMenuItem($categoryId: UUID!, $name: String!, $description: String, $price: Float!, $imageUrl: String) @auth(level: USER) {
  menuItem_insert(data: {
    categoryId: $categoryId,
    name: $name,
    description: $description,
    price: $price,
    imageUrl: $imageUrl
  })
}

mutation CreateTable($restaurantId: UUID!, $identifier: String!) @auth(level: USER) {
  table_insert(data: {
    restaurantId: $restaurantId,
    identifier: $identifier,
    status: "libre"
  })
}

mutation AddOrderItem($orderId: UUID!, $productId: String!, $name: String!, $quantity: Int!, $price: Float!) @auth(level: USER) {
  orderItem_insert(data: {
    orderId: $orderId,
    productId: $productId,
    name: $name,
    quantity: $quantity,
    price: $price
  })
}

# Updates
mutation UpdateTable($id: UUID!, $identifier: String, $status: String) @auth(level: USER) {
  table_update(id: $id, data: { identifier: $identifier, status: $status })
}

mutation UpdateMenuCategory($id: UUID!, $name: String, $iconUrl: String, $sortOrder: Int) @auth(level: USER) {
  menuCategory_update(id: $id, data: { name: $name, iconUrl: $iconUrl, sortOrder: $sortOrder })
}

mutation UpdateMenuItem($id: UUID!, $name: String, $description: String, $price: Float, $imageUrl: String, $isAvailable: Boolean) @auth(level: USER) {
  menuItem_update(id: $id, data: { name: $name, description: $description, price: $price, imageUrl: $imageUrl, isAvailable: $isAvailable })
}

# Deletes
mutation DeleteTable($id: UUID!) @auth(level: USER) {
  table_delete(id: $id)
}

mutation DeleteMenuCategory($id: UUID!) @auth(level: USER) {
  menuCategory_delete(id: $id)
}

mutation DeleteMenuItem($id: UUID!) @auth(level: USER) {
  menuItem_delete(id: $id)
}

mutation CreateSubscriptionPlan($name: String!, $pricePerMonth: Float!, $maxRestaurants: Int!, $maxWaiters: Int!, $maxTables: Int!) @auth(level: USER) {
  subscriptionPlan_insert(data: {
    name: $name,
    pricePerMonth: $pricePerMonth,
    maxRestaurants: $maxRestaurants,
    maxWaiters: $maxWaiters,
    maxTables: $maxTables
  })
}
