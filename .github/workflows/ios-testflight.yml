name: iOS TestFlight

# Genera un IPA firmado y opcionalmente lo sube a TestFlight.
#
# ── CONFIGURACIÓN NECESARIA (una sola vez) ──────────────────────────────
#
# 1) En Apple Developer (https://developer.apple.com/account/resources/certificates):
#    Crea un certificado de tipo "Apple Distribution" y expórtalo como .p12
#    (Keychain > Certificate Assistant > Exportar). Codifícalo en base64:
#        base64 -i Cert.p12 | pbcopy
#
# 2) Descarga el perfil de provisión (.mobileprovision) y codifícalo:
#        base64 -i Perfil.mobileprovision | pbcopy
#
# 3) En App Store Connect > Usuarios y acceso > Claves de API:
#    Crea una clave (Apple App Store Connect API), descarga el .p8 y anota
#    el Key ID y el Issuer ID. Codifica el .p8:
#        base64 -i AuthKey_XXXXXXXXXX.p8 | pbcopy
#
# 4) Guárdalos como Secrets del repo:
#    Settings (en el repo) > Secrets and variables > Actions > New repository secret
#      APPLE_CERT_P12            → el .p12 en base64
#      APPLE_CERT_PASSWORD       → la contraseña con la que exportaste el .p12
#      APPLE_PROVISIONING_PROFILE→ el .mobileprovision en base64
#      APP_STORE_CONNECT_KEY_P8  → el .p8 en base64
#      APP_STORE_CONNECT_KEY_ID  → Key ID (10 caracteres)
#      APP_STORE_CONNECT_ISSUER_ID → Issuer ID (UUID)
#
# ⚠️  OJO con el bundle id: el proyecto usa "com.rapimesa.app" (Apple no acepta
#    el prefijo com.example, está reservado). Debe coincidir en los 3 sitios:
#      - ios/Runner.xcodeproj/project.pbxproj  (PRODUCT_BUNDLE_IDENTIFIER)
#      - ios/Runner/GoogleService-Info.plist   (BUNDLE_ID)
#      - lib/firebase_options.dart             (ios > iosBundleId)
#    y estar registrado en Apple Developer + en la consola de Firebase.

on:
  push:
    branches: [main]
    paths:
      - 'RapiMesaFlutter/**'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Subir a TestFlight'
        type: boolean
        default: true
      build_number:
        description: 'Número de build (deja 0 para usar el del commit)'
        type: string
        default: '0'

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: IPA firmado
    runs-on: macos-14
    timeout-minutes: 60

    defaults:
      run:
        working-directory: RapiMesaFlutter

    steps:
      - name: Clonar
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Importar certificado de firma
        env:
          # Los secretos van por entorno, NO interpolados en el script: así
          # no se rompen si contienen comillas o $.
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -uo pipefail

          # El keychain con RUTA ABSOLUTA: en los runners una ruta relativa se
          # resuelve contra otro sitio y `security import` falla con errSecParam
          # ("One or more parameters passed to a function were not valid").
          KEYCHAIN="$RUNNER_TEMP/build.keychain"

          echo "▶ Longitud del base64 recibido: ${#APPLE_CERT_P12} (esperado 4304)"
          if ! printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12" 2>/dev/null; then
            echo "::error::El secreto APPLE_CERT_P12 no es base64 válido (seguro tiene saltos de línea)."
            exit 1
          fi
          echo "▶ Decodificado: $(wc -c < "$RUNNER_TEMP/cert.p12") bytes (esperado 3226)"

          # Validar el .p12 y la contraseña ANTES de importarlo. Si esto pasa,
          # el import ya no puede fallar por formato.
          if ! openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" \
               -passin "pass:$APPLE_CERT_PASSWORD" -nokeys -noout 2>/dev/null; then
            echo "::error::El secreto APPLE_CERT_P12 no es un .p12 válido O APPLE_CERT_PASSWORD es incorrecta."
            echo "::error::Regenera el secreto con:  base64 -i ~/rapimesa-firma/cert.p12 | tr -d '\\n' | pbcopy"
            exit 1
          fi
          echo "✅ .p12 válido y contraseña correcta"

          # ───────────────────────────────────────────────────────────────────
          # IMPORTAR
          #
          # NO se cambia el keychain por defecto del runner: con
          # `security default-keychain -s` el runner queda en un estado raro y
          # la importación falla con errSecParam. Se usa -k en cada comando.
          #
          # El .p12 es un PKCS#12: importarlo con "-t cert" hace que macOS
          # responda "Import/Export format unsupported" y no importe nada.
          # ───────────────────────────────────────────────────────────────────
          rm -f "$KEYCHAIN" "$KEYCHAIN-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"

          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" \
            -f pkcs12 \
            -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcrun \
            -T /usr/bin/security 2> "$RUNNER_TEMP/import.err"
          IMPORT_OK=$?

          if [ $IMPORT_OK -ne 0 ]; then
            echo "::warning::El primer import falló (código $IMPORT_OK): $(cat "$RUNNER_TEMP/import.err")"
            security unlock-keychain -p actions "$KEYCHAIN" || true
            security import "$RUNNER_TEMP/cert.p12" \
              -k "$KEYCHAIN" \
              -f pkcs12 \
              -P "$APPLE_CERT_PASSWORD" \
              -T /usr/bin/codesign \
              -T /usr/bin/xcrun \
              -T /usr/bin/security 2> "$RUNNER_TEMP/import.err"
            IMPORT_OK=$?
          fi

          if [ $IMPORT_OK -ne 0 ]; then
            echo "::error::No se pudo importar el .p12 en el keychain del runner: $(cat "$RUNNER_TEMP/import.err")"
            echo "::error::Suele ser que el secreto APPLE_CERT_P12 está truncado o que la contraseña no es la del .p12."
            exit 1
          fi

          # CADENA DE CONFIANZA: sin el "Apple Worldwide Developer Relations
          # CA (G3)" el certificado se marca como NO CONFIABLE y codesign
          # falla después con "no contiene una identidad válida".
          curl -sL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN" || true

          # Sin esto, el firma de códigos no puede leer la clave privada.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k actions "$KEYCHAIN" || true

          # AÑADIR A LA LISTA DE BÚSQUEDA (no cambiar el keychain por defecto):
          # si el keychain no está en la lista, xcodebuild/codesign no ven la
          # identidad y falla con "No signing certificate found".
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "--- identidades de firma en el runner ---"
          security find-identity -v -p codesigning "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution"; then
            echo "::error::No hay ninguna identidad de firma válida en el keychain del runner."
            exit 1
          fi

          rm -f "$RUNNER_TEMP/cert.p12"
          echo "✅ Certificado importado y verificado"

      - name: Instalar perfil de provisión
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -uo pipefail

          if ! printf '%s' "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision" 2>/dev/null; then
            echo "::error::El secreto APPLE_PROVISIONING_PROFILE no es base64 válido."
            exit 1
          fi

          # El perfil se instala con el nombre <UUID>.mobileprovision: es lo que
          # espera Xcode. Un nombre arbitrario a veces no lo detecta.
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist" 2>/dev/null || {
            echo "::error::El archivo decodificado no es un .mobileprovision válido."
            exit 1
          }
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")

          echo "Perfil: $PROFILE_NAME ($PROFILE_UUID)"
          echo "App ID: $PROFILE_APP_ID"

          if [ -z "$PROFILE_UUID" ] || [ -z "$PROFILE_NAME" ]; then
            echo "::error::El perfil no tiene UUID o Name; el archivo está corrupto."
            exit 1
          fi

          if [ "$PROFILE_NAME" != "RapiMesa AppStore" ]; then
            echo "::error::El perfil se llama '$PROFILE_NAME' pero project.pbxproj y ExportOptions.plist esperan 'RapiMesa AppStore'."
            echo "::error::O renombras el perfil en developer.apple.com y lo vuelves a descargar, o actualizas PROVISIONING_PROFILE_SPECIFIER."
            exit 1
          fi

          if [ "$PROFILE_APP_ID" != "3XW2235F4W.com.rapimesa.app" ]; then
            echo "::error::El perfil es para '$PROFILE_APP_ID' y no para 3XW2235F4W.com.rapimesa.app."
            echo "::error::Crea el perfil de tipo App Store para el App ID com.rapimesa.app."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          echo "✅ Perfil instalado"

      - name: Comprobar el bundle id
        run: |
          set -euo pipefail
          BUNDLE_ID=$(grep -m1 'PRODUCT_BUNDLE_IDENTIFIER = ' ios/Runner.xcodeproj/project.pbxproj \
            | sed 's/.*= //;s/;//' | tr -d ' ')
          echo "Bundle id: $BUNDLE_ID"
          if [[ "$BUNDLE_ID" == com.example.* ]]; then
            echo "::error::El bundle id '$BUNDLE_ID' es de ejemplo y Apple no lo acepta para TestFlight."
            echo "::error::Cámbialo en ios/Runner.xcodeproj/project.pbxproj, ios/Runner/GoogleService-Info.plist (BUNDLE_ID) y lib/firebase_options.dart (ios > bundleId), y registra ese App ID en Apple Developer y en la consola de Firebase."
            exit 1
          fi

      - name: Entitlement de APNs para distribución
        run: |
          set -euo pipefail
          # Con un certificado de Distribution, APNs usa el endpoint de
          # PRODUCCIÓN. El perfil de App Store solo autoriza "production": si
          # el binario pide "development", codesign falla con
          # "entitlements are not permitted".
          #
          # El repo ya trae "production". Este paso solo AVISA si alguien lo
          # dejó en "development" para depurar el push en local (y lo subió).
          if ! grep -A1 'aps-environment' ios/Runner/Runner.entitlements | grep -q 'production'; then
            echo "::error::Runner.entitlements tiene aps-environment = development; un IPA de App Store no se puede firmar así. Cámbialo a production."
            exit 1
          fi
          echo "✅ aps-environment = production"

      - name: Firmar y exportar IPA
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ inputs.build_number }}"
          if [ "$BUILD_NUMBER" = "0" ] || [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="${{ github.run_number }}"
          fi
          flutter build ipa --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=ios/ExportOptions.plist
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: RapiMesa-ipa
          path: RapiMesaFlutter/build/ios/ipa/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Subir a TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload == true }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_ISSUER_ID:-}" ] || [ -z "${ASC_KEY_P8:-}" ]; then
            echo "::error::Faltan los secretos APP_STORE_CONNECT_KEY_ID / _ISSUER_ID / _P8."
            exit 1
          fi

          # altool busca la llave en ~/.appstoreconnect/private_keys con el
          # nombre AuthKey_<KEY_ID>.p8. Si está en otro sitio, la ignora.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Subiendo $IPA"
          xcrun altool --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Limpiar
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -rf "$HOME/.appstoreconnect" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" || true

      - name: Resumen
        if: always()
        run: |
          {
            echo "### iOS TestFlight"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Artefacto: **RapiMesa-ipa**"
          } >> "$GITHUB_STEP_SUMMARY"
