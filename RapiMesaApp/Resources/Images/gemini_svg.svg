<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fondo Grafito Oscuro (Eliminar esta etiqueta <rect> si lo requieres transparente) -->
  <rect width="500" height="500" rx="100" fill="#1E232A" />

  <defs>
    <!-- Gradiente oficial Naranja Apetito a Ámbar Cálido -->
    <linearGradient id="rapiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E1E" />
      <stop offset="100%" stop-color="#FFAA00" />
    </linearGradient>
  </defs>

  <!-- Tirador superior del Cloche -->
  <circle cx="250" cy="115" r="22" fill="#FFAA00" />

  <!-- Cúpula de la campana con corte estilizado -->
  <path d="M 120 280 C 120 180, 200 135, 250 135 C 300 135, 380 180, 380 280 Z" fill="url(#rapiGrad)" />

  <!-- Silueta de rayo central dinámico -->
  <polygon points="265,110 215,225 255,225 230,315 295,200 255,200" fill="#FFAA00" stroke="#1E232A" stroke-width="4" stroke-linejoin="round" />

  <!-- Base horizontal de servicio -->
  <rect x="100" y="288" width="300" height="24" rx="12" fill="#FFAA00" />

  <!-- Tipografía RapiMesa -->
  <text x="250" y="400" text-anchor="middle" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="1">RapiMesa</text>
</svg>
